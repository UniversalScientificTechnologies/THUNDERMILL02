name: Create THUNDERMILL02 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    uses: ./.github/workflows/build_fw.yml
    with:
      build_type: R
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the branch head, which now holds the commit the build job made
          ref: ${{ github.ref_name }}

      - name: Gen Release Name
        id: gen_release_name
        run: |
          NEXTVERSION=fw/arduino/src/thundermill_fast_output_prototype_02/nextversion
          MAJOR=$(grep '^MAJOR ' $NEXTVERSION | awk '{print $2}')
          MINOR=$(grep '^MINOR ' $NEXTVERSION | awk '{print $2}')
          NEXTRELEASE=$(grep '^RELEASE ' $NEXTVERSION | awk '{print $2}')
          NEXTBUILD=$(grep '^BUILD ' $NEXTVERSION | awk '{print $2}')
          RELEASE=$(echo "$NEXTRELEASE-1" | bc)
          BUILD=$(echo "$NEXTBUILD-1" | bc)

          echo "tagname=THUNDERMILL02-${MAJOR}.${MINOR}.${RELEASE}-${BUILD}" >> $GITHUB_OUTPUT

      - name: Create TAG
        run: |
          echo "${{ steps.gen_release_name.outputs.tagname }}"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a ${{ steps.gen_release_name.outputs.tagname }} -m "Release ${{ steps.gen_release_name.outputs.tagname }}"
          git push origin ${{ steps.gen_release_name.outputs.tagname }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gen_release_name.outputs.tagname }}
          name: Release ${{ steps.gen_release_name.outputs.tagname }}
          draft: false
          prerelease: false
          files: fw/build/*.hex
